blockExoticSubdeps: true

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@webref/css'
  - '@mdn/browser-compat-data'
  - '@mdn/data'
  - web-features
  - '@deviltea/eslint-config'
  - '@deviltea/tsconfig'
shellEmulator: true

strictDepBuilds: true

trustPolicy: no-downgrade
trustPolicyExclude:
  # semver@6.3.1 (latest 6.x, required by @babel/core via `^6.3.1`) predates npm
  # provenance for the 6.x line; the "downgrade" is a publish-date false positive.
  - semver@6.3.1
packages:
  - docs
  - demo
  - playground
  - packages/*
# Security overrides for advisories in dev/CI/demo-only transitive deps (none
# ship in published @pikacss/* packages). Ranges use `>=` so the release-age
# policy above still picks the newest allowed patched version.
overrides:
  # changelogithub -> changelogen@0.5.7 -> c12@1 -> giget@1 is still tied to
  # tar@6, which has no patched release. Keep this scoped until upstream moves.
  giget@1>tar: '>=7.5.21 <8'

  # Monaco 0.57.0 pins and vendors DOMPurify 3.4.15, which is affected by
  # GHSA-p98j-92pf-mc4p. The pnpm patch redirects Monaco's runtime sanitizer
  # import to this dependency so the patched version is the code that executes.
  monaco-editor>dompurify: '>=3.4.16 <4'
patchedDependencies:
  monaco-editor@0.57.0: patches/monaco-editor@0.57.0.patch
catalog:
  '@arethetypeswrong/cli': ^0.18.5
  '@babel/parser': ^8.0.6
  '@babel/traverse': ^8.0.6
  '@babel/types': ^8.0.6
  '@clack/prompts': ^1.8.1
  '@deviltea/eslint-config': ^9.0.0
  '@deviltea/tsconfig': ^1.0.0
  '@iconify-json/line-md': ^1.2.16
  '@iconify-json/vscode-icons': ^1.2.83
  '@iconify/utils': ^3.1.7
  '@mdn/browser-compat-data': ^8.1.4
